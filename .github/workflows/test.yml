name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m pip install .
          git footprint -h

  # An older git than the hosted runners carry (Debian 12 ships 2.39): footprint and
  # overlap must pass on it, and the pairmerge tests, which need git 2.43, must skip.
  old-git:
    runs-on: ubuntu-22.04
    container: python:3.9-slim-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git
      - run: git --version
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v

  # The package PyPI would receive: built and checked on every change, not only at release.
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
